<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoGames</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 90vw;
        }
        h1 {
            color: #333;
        }
        .game-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .game-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vítejte v&nbsp;GeoGames</h1>
        <p>Vyber si hru</p>

        <!-- Ссылки на игры -->
        <a href="game_cesko/" class="game-link">Hra: Okresy České republiky</a>
        <a href="cz_geomorphology/" class="game-link">Hra: Geomorfologie Česka</a>
        <a href="cz_nature/" class="game-link">Hra: Chráněná území (NP a CHKO) Česka</a>
        <a href="cz_water/" class="game-link">Hra: Řeky Česka</a>
    </div>

</body>
</html>
